<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freelancer Payroll Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center py-10">
  <div class="bg-white shadow-xl rounded-2xl w-full max-w-3xl p-6">
    <h1 class="text-2xl font-bold text-center mb-6">Freelancer Payroll Tracker</h1>

    <!-- Mode Selection -->
    <div class="mb-6 flex justify-center gap-4">
      <button id="hourlyBtn" class="px-4 py-2 rounded-lg bg-blue-500 text-white">Hourly Rate</button>
      <button id="flatBtn" class="px-4 py-2 rounded-lg bg-gray-300">Flat Rate</button>
    </div>

    <!-- Hourly Mode Form -->
    <div id="hourlyForm">
      <label class="block mb-2 font-semibold">Start Time</label>
      <input type="time" id="startTime" class="border rounded p-2 w-full mb-4">

      <label class="block mb-2 font-semibold">End Time</label>
      <input type="time" id="endTime" class="border rounded p-2 w-full mb-4">

      <label class="block mb-2 font-semibold">Break (minutes)</label>
      <input type="number" id="breakTime" class="border rounded p-2 w-full mb-4" placeholder="0">

      <label class="block mb-2 font-semibold">Hourly Rate ($)</label>
      <input type="number" id="hourlyRate" class="border rounded p-2 w-full mb-4">
    </div>

    <!-- Flat Rate Form -->
    <div id="flatForm" class="hidden">
      <label class="block mb-2 font-semibold">Flat Fee ($)</label>
      <input type="number" id="flatFee" class="border rounded p-2 w-full mb-4">
    </div>

    <!-- Tax Rate -->
    <label class="block mb-2 font-semibold">Tax Withholding (%)</label>
    <input type="number" id="taxRate" class="border rounded p-2 w-full mb-4" value="15">

    <!-- Action Button -->
    <button onclick="addEntry()" class="w-full bg-green-500 text-white py-2 rounded-lg hover:bg-green-600">Add Entry</button>

    <!-- Table -->
    <div class="mt-6">
      <h2 class="text-xl font-semibold mb-2">Payroll Records</h2>
      <table class="w-full text-left border">
        <thead>
          <tr class="bg-gray-200">
            <th class="p-2 border">Date</th>
            <th class="p-2 border">Mode</th>
            <th class="p-2 border">Hours</th>
            <th class="p-2 border">Gross</th>
            <th class="p-2 border">Tax</th>
            <th class="p-2 border">Net</th>
          </tr>
        </thead>
        <tbody id="records"></tbody>
      </table>
    </div>
  </div>

  <script>
    let mode = "hourly";

    document.getElementById("hourlyBtn").onclick = () => {
      mode = "hourly";
      document.getElementById("hourlyForm").classList.remove("hidden");
      document.getElementById("flatForm").classList.add("hidden");
      document.getElementById("hourlyBtn").classList.replace("bg-gray-300", "bg-blue-500");
      document.getElementById("flatBtn").classList.replace("bg-blue-500", "bg-gray-300");
    };

    document.getElementById("flatBtn").onclick = () => {
      mode = "flat";
      document.getElementById("flatForm").classList.remove("hidden");
      document.getElementById("hourlyForm").classList.add("hidden");
      document.getElementById("flatBtn").classList.replace("bg-gray-300", "bg-blue-500");
      document.getElementById("hourlyBtn").classList.replace("bg-blue-500", "bg-gray-300");
    };

    function addEntry() {
      const taxRate = parseFloat(document.getElementById("taxRate").value) / 100;
      let hoursWorked = 0, gross = 0;

      if (mode === "hourly") {
        const start = document.getElementById("startTime").value;
        const end = document.getElementById("endTime").value;
        const breakMins = parseFloat(document.getElementById("breakTime").value) || 0;
        const hourlyRate = parseFloat(document.getElementById("hourlyRate").value) || 0;

        if (!start || !end) return alert("Please enter start and end times");

        const startDate = new Date(`1970-01-01T${start}:00`);
        const endDate = new Date(`1970-01-01T${end}:00`);
        let diffHours = (endDate - startDate) / (1000 * 60 * 60);
        diffHours -= breakMins / 60;

        hoursWorked = diffHours;
        gross = hoursWorked * hourlyRate;
      } else {
        gross = parseFloat(document.getElementById("flatFee").value) || 0;
      }

      const tax = gross * taxRate;
      const net = gross - tax;

      const row = `<tr>
        <td class='p-2 border'>${new Date().toLocaleDateString()}</td>
        <td class='p-2 border'>${mode === "hourly" ? "Hourly" : "Flat"}</td>
        <td class='p-2 border'>${hoursWorked.toFixed(2)}</td>
        <td class='p-2 border'>$${gross.toFixed(2)}</td>
        <td class='p-2 border'>$${tax.toFixed(2)}</td>
        <td class='p-2 border font-bold'>$${net.toFixed(2)}</td>
      </tr>`;

      document.getElementById("records").innerHTML += row;
    }
  </script>
</body>
</html>
