<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Moving Button</title>
  <style>
    body {
      display: flex;
      height: 100vh;
      justify-content: center;
      align-items: center;
      background: #f0f0f0;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      background-color: #3498db;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    button:hover {
      transform: translateX(20px);
    }

    button:active {
      transform: translateX(20px) translateY(10px);
      background-color: #2980b9;
    }
  </style>
</head>
<body>

  <button>Move Me!</button>

</body>
</html>
