<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urban Pizza Co.</title>
<style>
  /* Reset & base */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Montserrat', sans-serif;
    background: #fdfdfd;
    color: #222;
  }

  header {
    background: #ff4b3e;
    color: white;
    padding: 25px 0;
    text-align: center;
  }

  header h1 {
    font-size: 3em;
    letter-spacing: 2px;
  }

  nav {
    display: flex;
    justify-content: center;
    gap: 40px;
    margin-top: 10px;
  }

  nav a {
    text-decoration: none;
    color: white;
    font-weight: 600;
    transition: opacity 0.3s;
  }

  nav a:hover {
    opacity: 0.8;
  }

  main {
    padding: 60px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .section-title {
    font-size: 2.5em;
    margin-bottom: 40px;
    font-weight: 700;
    color: #ff4b3e;
  }

  .menu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 40px;
    width: 100%;
    max-width: 1200px;
  }

  .menu-card {
    background: #fff;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 15px 25px rgba(0,0,0,0.15);
    cursor: pointer;
    transition: transform 0.4s, box-shadow 0.4s;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .menu-card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
  }

  .menu-card span {
    padding: 20px 10px;
    font-weight: 700;
    font-size: 1.2em;
    color: #222;
    text-align: center;
  }

  .menu-card:hover {
    transform: translateY(-10px) scale(1.05);
    box-shadow: 0 25px 40px rgba(0,0,0,0.25);
  }

  footer {
    background: #222;
    color: #fff;
    text-align: center;
    padding: 25px 0;
    margin-top: 60px;
  }

  /* Optional animation: fade-in cascade */
  .menu-card {
    opacity: 0;
    transform: translateY(20px);
    animation: fadeInUp 0.8s forwards;
  }

  .menu-card:nth-child(1) { animation-delay: 0.2s; }
  .menu-card:nth-child(2) { animation-delay: 0.4s; }
  .menu-card:nth-child(3) { animation-delay: 0.6s; }
  .menu-card:nth-child(4) { animation-delay: 0.8s; }
  .menu-card:nth-child(5) { animation-delay: 1s; }

  @keyframes fadeInUp {
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<header>
  <h1>Urban Pizza Co.</h1>
  <nav>
    <a href="#">Home</a>
    <a href="#">Menu</a>
    <a href="#">About</a>
    <a href="#">Order Online</a>
  </nav>
</header>

<main>
  <h2 class="section-title">Our Signature Pizzas</h2>
  <div class="menu-grid">
    <div class="menu-card">
      <img src="https://picsum.photos/id/237/400/300" alt="Margherita">
      <span>Margherita</span>
    </div>
    <div class="menu-card">
      <img src="https://picsum.photos/id/238/400/300" alt="Pepperoni">
      <span>Pepperoni</span>
    </div>
    <div class="menu-card">
      <img src="https://picsum.photos/id/239/400/300" alt="Vegetarian">
      <span>Vegetarian</span>
    </div>
    <div class="menu-card">
      <img src="https://picsum.photos/id/240/400/300" alt="BBQ Chicken">
      <span>BBQ Chicken</span>
    </div>
    <div class="menu-card">
      <img src="https://picsum.photos/id/241/400/300" alt="Four Cheese">
      <span>Four Cheese</span>
    </div>
  </div>
</main>

<footer>
  &copy; 2025 Urban Pizza Co. | 456 Modern St, City | Phone: (555) 456-7890
</footer>

</body>
</html>
