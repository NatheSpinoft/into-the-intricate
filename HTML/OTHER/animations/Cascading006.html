<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parallax Scroll Cascade Menu</title>
<style>
  body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    background: linear-gradient(to bottom, #ffe5b4, #fff8f0);
    overflow-x: hidden;
  }

  h1 {
    text-align: center;
    margin: 50px 0;
    font-size: 2.2em;
    color: #333;
  }

  .menu-wrap {
    position: relative;
    width: 100%;
    max-width: 800px;
    margin: 0 auto;
    height: 1200px; /* Enough height to scroll */
  }

  .menu-card {
    position: absolute;
    width: 180px;
    height: 220px;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
    padding-bottom: 25px;
    transition: transform 0.3s, box-shadow 0.3s;
  }

  .menu-card img {
    width: 160px;
    height: 160px;
    object-fit: cover;
    margin-top: 10px;
    border-radius: 5px;
    border-bottom: 3px solid #fff;
  }

  .menu-card span {
    margin-top: 8px;
    font-weight: bold;
    color: #333;
    text-align: center;
  }

  /* Initial positions for cards */
  .menu-card:nth-child(1) { top: 100px; left: 50px; }
  .menu-card:nth-child(2) { top: 300px; left: 250px; }
  .menu-card:nth-child(3) { top: 500px; left: 100px; }
  .menu-card:nth-child(4) { top: 700px; left: 350px; }

  /* Hover pop effect */
  .menu-card:hover {
    transform: translateY(-10px) scale(1.05);
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    z-index: 5;
  }
</style>
</head>
<body>

<h1>Scroll Through Our Menu</h1>

<div class="menu-wrap">
  <div class="menu-card" data-speed="0.3">
    <img src="https://picsum.photos/id/237/200/200" alt="Dish 1">
    <span>Grilled Salmon</span>
  </div>
  <div class="menu-card" data-speed="0.5">
    <img src="https://picsum.photos/id/238/200/200" alt="Dish 2">
    <span>Caprese Salad</span>
  </div>
  <div class="menu-card" data-speed="0.7">
    <img src="https://picsum.photos/id/239/200/200" alt="Dish 3">
    <span>Margherita Pizza</span>
  </div>
  <div class="menu-card" data-speed="0.9">
    <img src="https://picsum.photos/id/240/200/200" alt="Dish 4">
    <span>Chocolate Cake</span>
  </div>
</div>

<script>
  const cards = document.querySelectorAll('.menu-card');

  window.addEventListener('scroll', () => {
    const scrollY = window.scrollY;

    cards.forEach(card => {
      const speed = parseFloat(card.dataset.speed);
      card.style.transform = `translateY(${scrollY * speed}px)`;
    });
  });
</script>

</body>
</html>
