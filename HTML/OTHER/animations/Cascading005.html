<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurant Floating Menu</title>
<style>
    body {
        margin: 0;
        background: linear-gradient(to bottom, #ffe5b4, #fff8f0); /* warm, appetizing gradient */
        font-family: 'Arial', sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 0;
        overflow-x: hidden;
    }

    h1 {
        font-size: 2em;
        color: #333;
        margin-bottom: 40px;
    }

    .menu-wrap {
        position: relative;
        width: 700px;
        height: 500px;
    }

    .menu-card {
        position: absolute;
        width: 150px;
        height: 180px;
        background-color: #fff;
        border-radius: 10px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow: hidden;
        opacity: 0;
        transform: translateY(50px) rotate(-2deg);
        animation: floatIn 1s forwards;
        transition: transform 0.3s, box-shadow 0.3s;
    }

    .menu-card img {
        width: 140px;
        height: 140px;
        object-fit: cover;
        margin-top: 10px;
        border-radius: 5px;
        border-bottom: 3px solid #fff;
    }

    .menu-card span {
        margin-top: 8px;
        font-weight: bold;
        font-size: 0.9em;
        color: #333;
        text-align: center;
    }

    /* Staggered floating animation */
    .menu-card:nth-child(1) { animation-delay: 0s; top: 300px; left: 50px; }
    .menu-card:nth-child(2) { animation-delay: 0.3s; top: 320px; left: 200px; }
    .menu-card:nth-child(3) { animation-delay: 0.6s; top: 340px; left: 350px; }
    .menu-card:nth-child(4) { animation-delay: 0.9s; top: 360px; left: 500px; }

    /* Floating animation keyframes */
    @keyframes floatIn {
        0% { opacity: 0; transform: translateY(50px) rotate(-5deg); }
        50% { opacity: 0.5; transform: translateY(10px) rotate(2deg); }
        100% { opacity: 1; transform: translateY(0) rotate(0deg); }
    }

    /* Slight sway effect */
    .menu-card {
        animation-name: floatIn, sway;
        animation-duration: 1s, 4s;
        animation-timing-function: ease-out, ease-in-out;
        animation-fill-mode: forwards, infinite;
    }

    @keyframes sway {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(10px); }
    }

    /* Hover pop effect */
    .menu-card:hover {
        transform: translateY(-10px) scale(1.05) rotate(-1deg);
        box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        z-index: 5;
    }
</style>
</head>
<body>

<h1>Our Fresh Menu</h1>

<div class="menu-wrap">
    <div class="menu-card">
        <img src="https://picsum.photos/id/237/200/200" alt="Dish 1">
        <span>Grilled Salmon</span>
    </div>
    <div class="menu-card">
        <img src="https://picsum.photos/id/238/200/200" alt="Dish 2">
        <span>Caprese Salad</span>
    </div>
    <div class="menu-card">
        <img src="https://picsum.photos/id/239/200/200" alt="Dish 3">
        <span>Margherita Pizza</span>
    </div>
    <div class="menu-card">
        <img src="https://picsum.photos/id/240/200/200" alt="Dish 4">
        <span>Chocolate Cake</span>
    </div>
</div>

</body>
</html>
