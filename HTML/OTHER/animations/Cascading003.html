<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snap Click Films - Polaroid Style</title>
<style>
    body {
        margin: 0;
        background-color: #1c1c1c; /* cinematic dark background */
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        color: #fff;
        text-align: center;
    }

    h1 {
        margin-top: 40px;
        font-size: 2em;
        letter-spacing: 1px;
        font-weight: 300;
        color: #f0f0f0;
    }

    .project-wrap {
        position: relative;
        width: 500px;
        height: 500px;
        margin: 60px auto;
    }

    .project-card {
        position: absolute;
        width: 150px;
        background-color: white;
        border-radius: 5px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: transform 0.4s, box-shadow 0.4s;
        overflow: hidden;
        padding-bottom: 25px; /* extra bottom for caption like Polaroid */
    }

    .project-card img {
        width: 140px;
        height: 140px;
        object-fit: cover;
        border-bottom: 3px solid #fff; /* mimics Polaroid thickness */
        margin-top: 10px;
    }

    .project-card span {
        margin-top: 10px;
        font-weight: bold;
        color: #111;
        font-size: 0.9em;
        text-align: center;
    }

    /* Cascade positioning */
    .project-card:nth-child(1) { top: 0px; left: 0px; z-index:3; }
    .project-card:nth-child(2) { top: 60px; left: 60px; z-index:2; }
    .project-card:nth-child(3) { top: 120px; left: 120px; z-index:1; }

    /* Hover effect: lift and slight rotation for realism */
    .project-card:hover {
        transform: translateY(-15px) rotate(-1deg);
        box-shadow: 0 20px 40px rgba(0,0,0,0.7);
        z-index: 5;
    }
</style>
</head>
<body>
<h1>Snap Click Films</h1>
<div class="project-wrap">
    <div class="project-card">
        <img src="https://picsum.photos/id/237/200/200" alt="Project 1">
        <span>Project 1</span>
    </div>
    <div class="project-card">
        <img src="https://picsum.photos/id/238/200/200" alt="Project 2">
        <span>Project 2</span>
    </div>
    <div class="project-card">
        <img src="https://picsum.photos/id/239/200/200" alt="Project 3">
        <span>Project 3</span>
    </div>
</div>
</body>
</html>
