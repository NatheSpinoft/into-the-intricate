<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurant Menu Cascade</title>
<style>
    body {
        margin: 0;
        background-color: #fef6e4; /* warm, appetizing background */
        font-family: 'Arial', sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 0;
    }

    h1 {
        font-size: 2em;
        color: #333;
        margin-bottom: 40px;
    }

    .menu-wrap {
        position: relative;
        width: 600px;
        height: 400px;
    }

    .menu-card {
        position: absolute;
        width: 150px;
        height: 180px;
        background-color: #fff;
        border-radius: 8px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow: hidden;
        opacity: 0;
        transform: translateY(-50px) scale(0.8) rotate(-2deg);
        animation: cascadeIn 0.6s forwards;
        transition: transform 0.3s, box-shadow 0.3s;
    }

    .menu-card img {
        width: 140px;
        height: 140px;
        object-fit: cover;
        margin-top: 10px;
        border-radius: 5px;
    }

    .menu-card span {
        margin-top: 8px;
        font-weight: bold;
        font-size: 0.9em;
        color: #333;
        text-align: center;
    }

    /* Cascade positions */
    .menu-card:nth-child(1) { top: 0px; left: 0px; animation-delay: 0s; z-index: 3; }
    .menu-card:nth-child(2) { top: 60px; left: 60px; animation-delay: 0.2s; z-index: 2; }
    .menu-card:nth-child(3) { top: 120px; left: 120px; animation-delay: 0.4s; z-index: 1; }
    .menu-card:nth-child(4) { top: 180px; left: 180px; animation-delay: 0.6s; z-index: 0; }

    /* Hover effect: lift card */
    .menu-card:hover {
        transform: translateY(-15px) scale(1.05) rotate(0deg);
        box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        z-index: 5;
    }

    /* Keyframe for cascading animation */
    @keyframes cascadeIn {
        to {
            opacity: 1;
            transform: translateY(0) scale(1) rotate(0deg);
        }
    }
</style>
</head>
<body>

<h1>Our Delicious Menu</h1>

<div class="menu-wrap">
    <div class="menu-card">
        <img src="https://picsum.photos/id/237/200/200" alt="Dish 1">
        <span>Grilled Salmon</span>
    </div>
    <div class="menu-card">
        <img src="https://picsum.photos/id/238/200/200" alt="Dish 2">
        <span>Caprese Salad</span>
    </div>
    <div class="menu-card">
        <img src="https://picsum.photos/id/239/200/200" alt="Dish 3">
        <span>Margherita Pizza</span>
    </div>
    <div class="menu-card">
        <img src="https://picsum.photos/id/240/200/200" alt="Dish 4">
        <span>Chocolate Cake</span>
    </div>
</div>

</body>
</html>
