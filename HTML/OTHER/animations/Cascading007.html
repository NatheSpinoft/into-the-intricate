<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curtain Reveal Menu</title>
<style>
  body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    background: linear-gradient(to bottom, #ffe5b4, #fff8f0);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 50px 0;
  }

  h1 {
    font-size: 2.2em;
    margin-bottom: 50px;
    color: #333;
    text-align: center;
  }

  .menu-wrap {
    display: flex;
    gap: 30px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .menu-card {
    position: relative;
    width: 180px;
    height: 220px;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
  }

  .menu-card img {
    width: 160px;
    height: 160px;
    object-fit: cover;
    margin-top: 10px;
    border-radius: 5px;
  }

  .menu-card span {
    margin-top: 8px;
    font-weight: bold;
    color: #333;
    text-align: center;
  }

  /* Curtain overlay */
  .curtain {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #333;
    transform: translateY(0%);
    transition: transform 0.6s ease-in-out;
    z-index: 2;
  }

  /* Reveal animation */
  .menu-card.revealed .curtain {
    transform: translateY(-100%);
  }

  /* Optional hover lift */
  .menu-card:hover {
    transform: translateY(-5px) scale(1.02);
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    z-index: 5;
    transition: transform 0.3s;
  }
</style>
</head>
<body>

<h1>Chef's Special Menu</h1>

<div class="menu-wrap">
  <div class="menu-card">
    <div class="curtain"></div>
    <img src="https://picsum.photos/id/237/200/200" alt="Dish 1">
    <span>Grilled Salmon</span>
  </div>
  <div class="menu-card">
    <div class="curtain"></div>
    <img src="https://picsum.photos/id/238/200/200" alt="Dish 2">
    <span>Caprese Salad</span>
  </div>
  <div class="menu-card">
    <div class="curtain"></div>
    <img src="https://picsum.photos/id/239/200/200" alt="Dish 3">
    <span>Margherita Pizza</span>
  </div>
  <div class="menu-card">
    <div class="curtain"></div>
    <img src="https://picsum.photos/id/240/200/200" alt="Dish 4">
    <span>Chocolate Cake</span>
  </div>
</div>

<script>
  // Sequentially reveal each card like a cascade
  const cards = document.querySelectorAll('.menu-card');
  cards.forEach((card, index) => {
    setTimeout(() => {
      card.classList.add('revealed');
    }, index * 400); // 0.4s delay between each card
  });
</script>

</body>
</html>
