<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anima 2</title>
</head>
<style>
    body {
        background-color: aquamarine;
    }

    .red {
        background-color: red;
        width: 100px;
        height: 100px;
        border-radius: 30px;
        transition: all 0.3s ease;

    }
    .red:hover{
        animation-name: anima01;
        animation-duration: (4s);
        animation-fill-mode: forwards;
    }

    /*animation code */
    @keyframes anima01 {
        from {
            background-color: red;
            transform: scale(0.9);
        }
        to {
            background-color: green;
            transform: scale(1.2);
        }
    }
</style>
<body>

    <div class="red">
        Stop

    </div>

</body>
</html>
